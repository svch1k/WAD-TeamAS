<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>addPost</title>
  <link rel="stylesheet" href="../css/normalize.css" />
  <link rel="stylesheet" href="../css/addPost.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/userMenu.css" />
  <link rel="stylesheet" href="../css/theme.css" />
</head>

<body class="page">
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <span aria-hidden="true">|</span>
      <a href="addPost.html">Add Post</a>
    </nav>

    <!-- Task 7: clicking the personal photo opens the user menu -->
    <div class="user-menu">
      <button type="button" class="user-menu-toggle" id="userMenuToggle" aria-haspopup="true" aria-expanded="false"
        aria-controls="userMenu" aria-label="Open user menu">
        <img class="avatar" src="../assets/avatar.svg" alt="" />
      </button>

      <div class="user-menu-list" id="userMenu" hidden>
        <p class="user-menu-name">John Doe</p>
        <a class="user-menu-email" href="mailto:john.doe@ut.ee">john.doe@ut.ee</a>
        <a class="user-menu-logout" href="login.html">logout</a>
      </div>
    </div>
  </header>

  <main>
    <form action="index.html">
      <div class="form-group">
        <label for="PostBody">Post body</label>
        <textarea id="PostBody" placeholder="Write your post content..." required></textarea>
      </div>

      <div class="form-group">
        <label for="SelectFile">Select file</label>
        <input type="file" id="SelectFile" />
      </div>

      <button type="submit" class="create-post-button">Create post</button>
    </form>
  </main>

  <footer>
    <p>2026 PostIt. Created by Team NN</p>
  </footer>
  <script src="../js/userMenu.js"></script>
</body>

</html>
